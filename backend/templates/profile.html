{% extends 'base.html' %}
{% load static %}
{% block title %}My Profile | LearnSpace{% endblock %}
{% block content %}<link rel="stylesheet" href="{% static 'css/profile-page.css' %}">
<section class="profile-page"><div class="profile-top"><a href="javascript:history.back()" class="back-link">←</a><h1>My Profile</h1></div><div id="profile-view" class="profile-content"><p>Loading profile…</p></div><form id="profile-form" class="profile-edit hidden" enctype="multipart/form-data"><div class="edit-header"><h2>Edit profile</h2><button type="button" class="link-button" onclick="toggleProfileEdit()">Cancel</button></div><div class="profile-form-grid"><label>First name<input name="first_name"></label><label>Last name<input name="last_name"></label><label>Email<input name="email" type="email" required></label><label>Phone number<input name="phone_number"></label><label>Gender<select name="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></label><label>Date of birth<input name="date_of_birth" type="date"></label><label>Current city<input name="current_city"></label><label>Current state<input name="current_state"></label><label>Work experience<input name="work_experience" placeholder="Fresher"></label><label>Profile photo<input name="avatar" type="file" accept=".jpg,.jpeg,.png,.webp"></label><label class="full">Bio<textarea name="bio" maxlength="500"></textarea></label></div><p class="form-message" id="form-message"></p><button class="button" type="submit">Save changes</button></form></section>
{% endblock %}
{% block scripts %}<script>loadProfilePage();document.querySelector('#profile-form').addEventListener('submit', saveProfile);</script>{% endblock %}
