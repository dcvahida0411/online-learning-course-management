{% extends 'base.html' %}
{% block title %}Reset Password | LearnSpace{% endblock %}
{% block content %}
<section class="auth-wrap"><form id="reset-password-form" class="auth-card">
  <p class="eyebrow">PASSWORD RECOVERY</p><h1>Set a new password</h1>
  <label>New password<input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Minimum 8 characters"></label>
  <label>Confirm password<input name="confirm_password" type="password" minlength="8" required autocomplete="new-password"></label>
  <p class="form-message" id="form-message"></p>
  <button class="button" type="submit">Reset password</button>
  <a class="back-to-login" href="/student/login/">← Back to login</a>
</form></section>
{% endblock %}
{% block scripts %}<script>document.querySelector('#reset-password-form').addEventListener('submit', confirmPasswordReset);</script>{% endblock %}
