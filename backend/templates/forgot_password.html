{% extends 'base.html' %}
{% block title %}Forgot Password | LearnSpace{% endblock %}
{% block content %}
<section class="auth-wrap"><form id="forgot-password-form" class="auth-card">
  <p class="eyebrow">PASSWORD RECOVERY</p><h1>Forgot password?</h1>
  <p class="page-description">Enter your registered email address. We will send a secure reset link.</p>
  <label>Email<input name="email" type="email" required autocomplete="email" placeholder="name@example.com"></label>
  <p class="form-message" id="form-message"></p>
  <button class="button" type="submit">Send reset link</button>
  <p><a href="/student/login/">Back to login</a></p>
</form></section>
{% endblock %}
{% block scripts %}<script>document.querySelector('#forgot-password-form').addEventListener('submit', requestPasswordReset);</script>{% endblock %}
